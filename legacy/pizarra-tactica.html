<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pizarra Táctica — Club Manager</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0C1116; --panel:#141C24; --panel2:#1B252F; --line:#243340;
    --chalk:#EAF2EC; --muted:#7D93A3; --mint:#3FE0B0;
    --grass:#0E6B4F; --grassAlt:#0B5C43; --home:#F4F7F3; --away:#D6274B;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{min-height:100vh;background:var(--ink);color:var(--chalk);font-family:'Archivo',system-ui,sans-serif;font-size:14px}
  .mono{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace}
  h1,h2,h3,.disp{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;letter-spacing:.02em;margin:0}
  .eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  header.bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand .name{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1}
  .badge{border:1px solid var(--mint);color:var(--mint);border-radius:999px;padding:2px 9px;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
  nav{display:flex;gap:4px;margin-left:auto;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px}
  nav button{display:flex;align-items:center;gap:7px;background:none;border:0;color:var(--muted);padding:7px 14px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px}
  nav button.on{background:var(--mint);color:var(--ink);font-weight:600}
  nav button:hover:not(.on){color:var(--chalk)}
  main{padding:16px 20px 60px;max-width:1560px;margin:0 auto}
  .tray{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px}
  .tgroup{display:flex;gap:2px;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:3px}
  .tool{position:relative;display:grid;place-items:center;width:38px;height:34px;border:0;border-radius:6px;background:none;color:var(--muted);cursor:pointer}
  .tool:hover{color:var(--chalk);background:var(--panel2)}
  .tool.on{background:var(--chalk);color:var(--ink)}
  .swatch{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer}
  .swatch.on{border-color:var(--chalk);box-shadow:0 0 0 2px var(--ink)}
  .btn{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);color:var(--chalk);border:1px solid var(--line);border-radius:7px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
  .btn:hover{border-color:var(--muted)}
  .btn.primary{background:var(--mint);color:var(--ink);border-color:var(--mint);font-weight:600}
  .btn.ghost{background:none}
  .btn.danger:hover{border-color:var(--away);color:var(--away)}
  .layout{display:grid;grid-template-columns:250px minmax(0,1fr) 268px;gap:14px;align-items:start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .card + .card{margin-top:12px}
  .card h3{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  label.f{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:10px 0 5px}
  input,select,textarea{width:100%;background:var(--ink);border:1px solid var(--line);color:var(--chalk);border-radius:7px;padding:8px 10px;font:inherit;font-size:13px}
  input:focus,select:focus,textarea:focus,.tool:focus-visible,.btn:focus-visible,nav button:focus-visible{outline:2px solid var(--mint);outline-offset:1px}
  .row{display:flex;gap:8px}
  .seg{display:flex;gap:3px;background:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px}
  .seg button{flex:1;background:none;border:0;color:var(--muted);padding:6px;border-radius:5px;font:inherit;font-size:12px;cursor:pointer}
  .seg button.on{background:var(--panel2);color:var(--chalk);font-weight:600}
  .teamdot{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:middle}
  .board{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
  .hint{font-size:12px;color:var(--muted);line-height:1.5}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  .grid-plays{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .play{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .play .thumb{background:var(--ink);padding:6px}
  .play .meta{padding:10px 12px}
  .play .cat{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mint)}
  .play .acts{display:flex;gap:6px;padding:0 12px 12px}
  .block{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
  .empty{border:1px dashed var(--line);border-radius:10px;padding:34px;text-align:center;color:var(--muted)}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--chalk);color:var(--ink);padding:10px 18px;border-radius:999px;font-weight:600;font-size:13px;z-index:50}
  .loading{display:flex;align-items:center;justify-content:center;height:100vh;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:20px;letter-spacing:.08em;text-transform:uppercase}
  @media (max-width:1100px){.layout{grid-template-columns:1fr}.side-r{order:3}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
