services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pizarra
      POSTGRES_PASSWORD: pizarra
      POSTGRES_DB: pizarra
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pizarra']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      # Valores por defecto para el stack local; exporta la variable (o ponla en
      # un .env junto a este fichero) para apuntar a otra base, p. ej. Supabase.
      PIZARRA_DATABASE_URL: ${PIZARRA_DATABASE_URL:-postgresql+psycopg://pizarra:pizarra@db:5432/pizarra}
      PIZARRA_CORS_ORIGINS: ${PIZARRA_CORS_ORIGINS:-http://localhost:8180}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8100:8000'

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - '8180:80'

volumes:
  pgdata:
